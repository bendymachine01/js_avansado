
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gráfica estadística</title>
</head>
<body>
    <h2>Videojuegos favoritos</h2>

    <canvas id="grafica" width="500" height="350"
            style="border:1px solid black;"></canvas>

    <script>
        const canvas = document.getElementById("grafica");
        const ctx = canvas.getContext("2d");

        const nombres = ["Minecraft", "Roblox", "FIFA", "Fortnite"];
        const datos = [8, 12, 6, 10];
        let progreso = 0;

        function dibujarGrafica() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ejes
            ctx.beginPath();
            ctx.moveTo(50, 20);
            ctx.lineTo(50, 300);
            ctx.lineTo(480, 300);
            ctx.strokeStyle = "black";
            ctx.stroke();

            // Título del eje vertical
            ctx.fillStyle = "black";
            ctx.font = "12px Arial";
            ctx.fillText("Estudiantes", 5, 15);

            for (let i = 0; i < datos.length; i++) {
                const alto = Math.min(datos[i] * 15, progreso);
                const x = 80 + i * 100;
                const y = 300 - alto;

                ctx.fillStyle = "blue";
                ctx.fillRect(x, y, 50, alto);

                ctx.fillStyle = "black";
                ctx.fillText(nombres[i], x - 5, 320);
                if (alto >= datos[i] * 15) {
                    ctx.fillText(datos[i], x + 15, y - 5);
                }
            }

            if (progreso < 180) {
                progreso += 2;
                requestAnimationFrame(dibujarGrafica);
            }
        }

        dibujarGrafica();
    </script>
</body>
</html>
