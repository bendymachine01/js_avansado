
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Animación Canvas</title>
</head>
<body>
    <h2>Pelota rebotando</h2>

    <canvas id="canvas" width="500" height="300"
            style="border:1px solid black;"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let x = 50;
        let y = 50;
        let velocidadX = 3;
        let velocidadY = 2;
        const radio = 20;

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(x, y, radio, 0, Math.PI * 2);
            ctx.fillStyle = "blue";
            ctx.fill();

            x += velocidadX;
            y += velocidadY;

            if (x + radio > canvas.width || x - radio < 0) {
                velocidadX *= -1;
            }

            if (y + radio > canvas.height || y - radio < 0) {
                velocidadY *= -1;
            }

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
