
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de tareas</title>
</head>
<body>
    <h1>Lista de tareas</h1>

    <input type="text" id="tarea" placeholder="Escribe una tarea">
    <button id="agregar">Agregar tarea</button>
    <button id="borrarTodo">Borrar todas</button>

    <ul id="lista"></ul>
    <p id="mensaje"></p>

    <script>
        let tareas = JSON.parse(localStorage.getItem("tareas")) || [];

        const entrada = document.getElementById("tarea");
        const lista = document.getElementById("lista");
        const mensaje = document.getElementById("mensaje");

        function guardarTareas() {
            localStorage.setItem("tareas", JSON.stringify(tareas));
        }

        function mostrarTareas() {
            lista.innerHTML = "";

            if (tareas.length === 0) {
                mensaje.textContent = "No hay tareas pendientes.";
                return;
            }

            mensaje.textContent = "";

            tareas.forEach(function(tarea, indice) {
                const elemento = document.createElement("li");
                elemento.textContent = tarea + " ";

                const boton = document.createElement("button");
                boton.textContent = "Eliminar";

                boton.addEventListener("click", function() {
                    tareas.splice(indice, 1);
                    guardarTareas();
                    mostrarTareas();
                });

                elemento.appendChild(boton);
                lista.appendChild(elemento);
            });
        }

        document.getElementById("agregar").addEventListener("click", function() {
            const nuevaTarea = entrada.value.trim();

            if (nuevaTarea === "") {
                mensaje.textContent = "Escribe una tarea primero.";
                return;
            }

            tareas.push(nuevaTarea);
            guardarTareas();

            entrada.value = "";
            mostrarTareas();
        });

        document.getElementById("borrarTodo").addEventListener("click", function() {
            tareas = [];
            guardarTareas();
            mostrarTareas();
        });

        mostrarTareas();
    </script>
</body>
</html>
